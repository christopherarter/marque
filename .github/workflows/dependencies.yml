name: Dependencies

on:
  pull_request:
    paths:
      - 'composer.json'
      - '.github/workflows/dependencies.yml'
  push:
    branches: [main]
    paths:
      - 'composer.json'
      - '.github/workflows/dependencies.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: 1

jobs:
  audit:
    name: Validate and audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      - run: composer update --prefer-dist --no-progress --no-install
      - run: composer audit --locked
