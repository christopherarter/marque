name: Tests

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_INTERACTION: 1

jobs:
  sqlite:
    name: SQLite / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependency }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        dependency: [highest]
        include:
          - php: '8.4'
            laravel: '12'
            dependency: lowest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          extensions: redis
          tools: composer:v2

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}-${{ github.run_id }}
          restore-keys: |
            composer-${{ runner.os }}-${{ hashFiles('composer.json') }}-
            composer-${{ runner.os }}-

      - run: composer require illuminate/support:^${{ matrix.laravel }}.0 --no-update
      - run: composer update --prefer-dist --prefer-stable --no-progress ${{ matrix.dependency == 'lowest' && '--prefer-lowest' || '' }}

      - run: composer test:coverage -- --ci

  pgsql:
    name: PostgreSQL / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: redis, pdo_pgsql
          tools: composer:v2

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}-${{ github.run_id }}
          restore-keys: |
            composer-${{ runner.os }}-${{ hashFiles('composer.json') }}-
            composer-${{ runner.os }}-

      - run: composer require illuminate/support:^${{ matrix.laravel }}.0 --no-update
      - run: composer update --prefer-dist --prefer-stable --no-progress

      - run: docker compose up -d --wait postgres valkey

      - run: composer test:pgsql -- --ci

      - if: always()
        run: docker compose down --volumes
